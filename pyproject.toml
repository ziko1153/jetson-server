[project]
name = "ugv-jetson-gateway"
version = "0.1.0"
description = "Camera gateway and video management service for a UGV Jetson Orin NX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pymavlink>=2.4.42",
  "pyserial>=3.5",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
ugv-gateway = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: tests that publish real local RTSP video",
]
addopts = "-q"
